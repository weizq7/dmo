[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dmo"
version = "0.1.0"
description = "Direct Mixture Optimization for looped language models"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0",
    "transformers",
    "datasets",
    "wandb",
    "pyyaml",
    "lm-eval",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"assets/generation" = "assets/generation"
"scripts/evaluate_generation.py" = "scripts/evaluate_generation.py"
"scripts/prepare_generation.py" = "scripts/prepare_generation.py"
"scripts/generate_135m.sh" = "scripts/generate_135m.sh"
