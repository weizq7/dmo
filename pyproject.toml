[project]
name = "dmo"
version = "0.1.0"
description = "Direct Mixture Optimization for looped language models"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0",
    "transformers",
    "datasets",
    "wandb",
    "pyyaml",
    "lm-eval",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
